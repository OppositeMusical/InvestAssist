[project]
name = "investassist"
version = "0.1.0"
description = "Buy/sell decision assist for US stocks that interfaces with thinkorswim"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Windows-only: RTD COM bridge and global hotkey registration.
windows = ["pywin32>=306"]
# Free history providers for backfill. Neither is required by the core engine.
data = ["yfinance>=0.2.40", "requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
investassist = "investassist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["investassist*"]

[tool.setuptools.package-data]
investassist = ["spec/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
